<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>Al-Monopoly Al-Arabi - بنك الـ 200 سؤال المطور</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root { 
      --primary: #009639; 
      --secondary: #d00c25; 
      --gold: #f39c12; 
      --bg: #f4f6f7; 
      --card-bg: #ffffff; 
      --text: #2c3e50; 
    }
    body { margin: 0; font-family: 'Segoe UI', Tahoma, sans-serif; background-color: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .container { width: 95%; max-width: 500px; text-align: center; }
    .card { background: var(--card-bg); border-radius: 20px; padding: 25px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); border-top: 8px solid var(--primary); min-height: 380px; display: flex; flex-direction: column; justify-content: center; }
    .badges { display: flex; justify-content: center; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
    .badge { padding: 5px 12px; border-radius: 15px; font-size: 0.85rem; font-weight: bold; color: white; }
    .badge-category { background: #2c3e50; }
    .badge-type { background: #7f8c8d; }
    .question-text { font-size: 1.25rem; line-height: 1.6; margin-bottom: 20px; font-weight: bold; color: #34495e; text-align: justify; text-align-last: center; }
    .reward-box { font-size: 1.1rem; font-weight: bold; padding: 10px; border-radius: 10px; margin-bottom: 15px; border: 2px dashed; }
    .answer-box { display: none; background: #ecf0f1; padding: 15px; border-radius: 10px; font-size: 1.1rem; color: #16a085; font-weight: bold; margin-bottom: 15px; border-right: 5px solid #16a085; }
    .buttons-container { display: flex; flex-direction: column; gap: 10px; }
    .btn { color: white; border: none; padding: 14px; font-size: 1rem; border-radius: 10px; cursor: pointer; font-weight: bold; transition: 0.2s; }
    .btn-primary { background: var(--primary); }
    .btn-gold { background: var(--gold); }
    .btn-secondary { background: #7f8c8d; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div id="initialState" style="font-size: 1.3rem; color: #2c3e50; font-weight: bold;">🇵🇸 بنك الأسئلة الثقافية، الإسلامية والتاريخية المطورة 📚</div>
      <div id="questionContent" style="display: none;">
        <div class="badges">
          <span class="badge badge-category" id="qCategory"></span>
          <span class="badge badge-type" id="qType"></span>
        </div>
        <div class="question-text" id="qText"></div>
        <div class="reward-box" id="qReward"></div>
        <div class="answer-box" id="aBox">الإجابة الصحيحة: <span id="aText"></span></div>
      </div>
      <button class="btn btn-secondary" id="btnShowAnswer" onclick="showAnswer()" style="display: none; margin-bottom: 10px;">👁 إظهار الإجابة والقرار</button>
      <div class="buttons-container">
        <button class="btn btn-primary" onclick="drawNewQuestion('steps')">🎯 سحب سؤال للتقدم (100 سؤال حركة)</button>
        <button class="btn btn-gold" onclick="drawNewQuestion('money')">💰 سحب سؤال جاوب واربح (100 سؤال مالي)</button>
      </div>
    </div>
  </div>

  <script>
    // 1. مصفوفة كروت التقدم والحركة (100 سؤال كاملة وموزعة برمجياً بالتناوب لضمان عدم التكرار)
    const stepsQuestions = [
      { text: "ما هي المدينة الفلسطينية التي تُعد أقدم مدينة مأهولة في التاريخ؟", category: "جغرافيا فلسطين 📍", type: "حركة", value: "🎲 صح: تقدم 3 خطوات | خطأ: ارجع خطوتين", color: "#3498db", answer: "أريحا" },
      { text: "في أي عام حدثت النكبة الفلسطينية وتم تهجير الشعب الفلسطيني؟", category: "تاريخ فلسطين ⏳", type: "حركة", value: "🎲 صح: تقدم 4 خطوات | خطأ: ارجع 3 خطوات", color: "#3498db", answer: "1948م" },
      { text: "كم عدد الخلفاء الراشدين الذين تولوا الخلافة بعد وفاة الرسول ﷺ؟", category: "تاريخ إسلامي 🕋", type: "حركة", value: "🎲 صح: تقدم 3 خطوات | خطأ: ارجع خطوة", color: "#3498db", answer: "4 خلفاء (أبو بكر، عمر، عثمان، علي)" },
      { text: "ما هي المدينة الفلسطينية المشهورة بصناعة الفخار والزجاج والحلويات الخليطية؟", category: "جغرافيا فلسطين 📍", type: "حركة", value: "🎲 صح: تقدم 3 خطوات | خطأ: ارجع خطوتين", color: "#3498db", answer: "الخليل" },
      { text: "ما هي السورة التي تُسمى 'عروس القرآن'؟", category: "ثقافة إسلامية 📜", type: "حركة", value: "🎲 صح: تقدم 4 خطوات | خطأ: ارجع خطوتين", color: "#3498db", answer: "سورة الرحمن" },
      { text: "من هو القائد المسلم الذي انتصر على الصليبيين وحرر القدس في معركة حطين؟", category: "تاريخ إسلامي ⚔️", type: "حركة", value: "🎲 صح: تقدم 5 خطوات | خطأ: ارجع 3 خطوات", color: "#3498db", answer: "صلاح الدين الأيوبي" },
      { text: "ما هي أكبر مدينة في قطاع غزة من حيث المساحة والسكان؟", category: "جغرافيا فلسطين 📍", type: "حركة", value: "🎲 صح: تقدم 3 خطوات | خطأ: ارجع خطوة", color: "#3498db", answer: "مدينة غزة" },
      { text: "ما هو الاسم القديم الذي أطلقه الكنعانيون على مدينة القدس؟", category: "تاريخ فلسطين ⏳", type: "حركة", value: "🎲 صح: تقدم 5 خطوات | خطأ: ارجع 3 خطوات", color: "#3498db", answer: "أورساليم (أو يبوس)" },
      { text: "من هو أول مؤذن في الإسلام؟", category: "تاريخ إسلامي 🕋", type: "حركة", value: "🎲 صح: تقدم 3 خطوات | خطأ: ارجع خطوتين", color: "#3498db", answer: "بلال بن رباح رضي الله عنه" },
      { text: "ما هو البحر المغلق الذي يقع في فلسطين ويعد أخفض نقطة على سطح الأرض؟", category: "جغرافيا فلسطين 📍", type: "حركة", value: "🎲 صح: تقدم 3 خطوات | خطأ: ارجع خطوة", color: "#3498db", answer: "البحر الميت" },
      { text: "في أي مدينة فلسطينية ولد السيد المسيح عيسى عليه السلام؟", category: "تاريخ وفلكلور 🌾", type: "حركة", value: "🎲 صح: تقدم 3 خطوات | خطأ: ارجع خطوتين", color: "#3498db", answer: "بيت لحم (في مغارة المهد)" },
      { text: "كم عدد السجدات المفروضة في القرآن الكريم؟", category: "ثقافة إسلامية 📜", type: "حركة", value: "🎲 صح: تقدم 4 خطوات | خطأ: ارجع خطوتين", color: "#3498db", answer: "15 سجدة" },
      { text: "ما هي الغزوة التي جُرح فيها الرسول ﷺ وكُسرت رباعيته؟", category: "تاريخ إسلامي ⚔️", type: "حركة", value: "🎲 صح: تقدم 5 خطوات | خطأ: ارجع 3 خطوات", color: "#3498db", answer: "غزوة أحد" },
      { text: "ما هي المدينة الفلسطينية المعروفة بلقب 'جبل النار' وتشتهر بالصابون والنابلسية؟", category: "جغرافيا فلسطين 📍", type: "حركة", value: "🎲 صح: تقدم 4 خطوات | خطأ: ارجع خطوتين", color: "#3498db", answer: "نابلس" },
      { text: "ما هي أطول سورة في القرآن الكريم؟", category: "ثقافة إسلامية 📜", type: "حركة", value: "🎲 صح: تقدم 3 خطوات | خطأ: ارجع خطوة", color: "#3498db", answer: "سورة البقرة" },
      { text: "من هو الصحابي الذي لُقب بـ 'سيف الله المسلول'؟", category: "تاريخ إسلامي ⚔️", type: "حركة", value: "🎲 صح: تقدم 3 خطوات | خطأ: ارجع خطوتين", color: "#3498db", answer: "خالد بن الوليد رضي الله عنه" },
      { text: "ما هي الشجرة المباركة التي تعد رمزاً للصمود والتمسك بالأرض في فلسطين؟", category: "ثقافة وفلكلور 🌾", type: "حركة", value: "🎲 صح: تقدم 3 خطوات | خطأ: ارجع خطوة", color: "#3498db", answer: "شجرة الزيتون" },
      { text: "ما هي المدينة الفلسطينية الساحلية التي قاومت نابليون بونابرت وعجز عن دخولها؟", category: "تاريخ فلسطين ⏳", type: "حركة", value: "🎲 صح: تقدم 5 خطوات | خطأ: ارجع 3 خطوات", color: "#3498db", answer: "عكا" },
      { text: "كم عدد سنوات نزول القرآن الكريم على الرسول ﷺ؟", category: "ثقافة إسلامية 📜", type: "حركة", value: "🎲 صح: تقدم 4 خطوات | خطأ: ارجع خطوتين", color: "#3498db", answer: "23 سنة" },
      { text: "ما هي المدينة الفلسطينية التي تقع بالكامل في مرج ابن عامر وتعتبر سلة خضار فلسطين؟", category: "جغرافيا فلسطين 📍", type: "حركة", value: "🎲 صح: تقدم 4 خطوات | خطأ: ارجع خطوتين", color: "#3498db", answer: "جنين" },
      { text: "من هو النبي الذي ابتلعه الحوت ودعا ربه في الظلمات؟", category: "قصص الأنبياء 🕋", type: "حركة", value: "🎲 صح: تقدم 3 خطوات | خطأ: ارجع خطوة", color: "#3498db", answer: "يونس عليه السلام" },
      { text: "ما هو الجبل المشهور في القدس الذي يطل على المسجد الأقصى من الجهة الشرقية؟", category: "جغرافيا فلسطين 📍", type: "حركة", value: "🎲 صح: تقدم 4 خطوات | خطأ: ارجع خطوتين", color: "#3498db", answer: "جبل الزيتون (الطور)" },
      { text: "في أي شهر هجري يصوم المسلمون؟", category: "ثقافة إسلامية 📜", type: "حركة", value: "🎲 صح: تقدم 3 خطوات | خطأ: ارجع خطوة", color: "#3498db", answer: "شهر رمضان" },
      { text: "ما هي المدينة الفلسطينية التي تضم الحرم الإبراهيمي الشريف؟", category: "جغرافيا فلسطين 📍", type: "حركة", value: "🎲 صح: تقدم 3 خطوات | خطأ: ارجع خطوتين", color: "#3498db", answer: "الخليل" },
      { text: "ما هي المعركة التاريخية التي انتصر فيها المماليك على المغول في فلسطين؟", category: "تاريخ فلسطين ⏳", type: "حركة", value: "🎲 صح: تقدم 5 خطوات | خطأ: ارجع 4 خطوات", color: "#3498db", answer: "معركة عين جالوت" },
      { text: "من هو الصحابي الذي رافق الرسول ﷺ في الهجرة إلى المدينة المنورة؟", category: "تاريخ إسلامي 🕋", type: "حركة", value: "🎲 صح: تقدم 3 خطوات | خطأ: ارجع خطوة", color: "#3498db", answer: "أبو بكر الصديق رضي الله عنه" },
      { text: "ما هي عاصمة فلسطين الأبدية؟", category: "جغرافيا فلسطين 📍", type: "حركة", value: "🎲 صح: تقدم 3 خطوات | خطأ: ارجع 3 خطوات", color: "#3498db", answer: "القدس الشريف" },
      { text: "كم عدد مصارف الزكاة التي ذكرت في القرآن الكريم؟", category: "ثقافة إسلامية 📜", type: "حركة", value: "🎲 صح: تقدم 4 خطوات | خطأ: ارجع خطوتين", color: "#3498db", answer: "8 مصارف" },
      { text: "ما هي الأكلة الشعبية الفلسطينية الفخمة التي تُطبخ على الحطب بزيت الزيتون والبلدي والخبز الطابون؟", category: "ثقافة وفلكلور 🌾", type: "حركة", value: "🎲 صح: تقدم 3 خطوات | خطأ: ارجع خطوة", color: "#3498db", answer: "المسخن" },
      { text: "ما هي المدينة الفلسطينية الشهيرة بـ 'أم الفحم' وتعتبر من مدن الداخل المحتل؟", category: "جغرافيا فلسطين 📍", type: "حركة", value: "🎲 صح: تقدم 3 خطوات | خطأ: ارجع خطوتين", color: "#3498db", answer: "أم الفحم" },
      { text: "من هو النبي الذي نجاه الله من النار التي جعلها الله برداً وسلاماً عليه؟", category: "قصص الأنبياء 🕋", type: "حركة", value: "🎲 صح: تقدم 3 خطوات | خطأ: ارجع خطوة", color: "#3498db", answer: "إبراهيم عليه السلام" },
      { text: "في أي مدينة فلسطينية يقع قبر ومقام النبي لوط عليه السلام؟", category: "تاريخ فلسطين ⏳", type: "حركة", value: "🎲 صح: تقدم 4 خطوات | خطأ: ارجع خطوتين", color: "#3498db", answer: "بني نعيم في الخليل" },
      { text: "ما هي السورة التي تعدل ثلث القرآن الكريم؟", category: "ثقافة إسلامية 📜", type: "حركة", value: "🎲 صح: تقدم 3 خطوات | خطأ: ارجع خطوة", color: "#3498db", answer: "سورة الإخلاص" },
      { text: "ما هي المدينة الفلسطينية التي تشتهر ببرتقالها الفخم وتعتبر 'عروس البحر'؟", category: "جغرافيا فلسطين 📍", type: "حركة", value: "🎲 صح: تقدم 4 خطوات | خطأ: ارجع خطوتين", color: "#3498db", answer: "يافا" },
      { text: "من هو القائد الملوكي الذي قاد جيش المسلمين في معركة عين جالوت؟", category: "تاريخ إسلامي ⚔️", type: "حركة", value: "🎲 صح: تقدم 5 خطوات | خطأ: ارجع 3 خطوات", color: "#3498db", answer: "سيف الدين قطز" },
      { text: "ما هي القرية الفلسطينية التاريخية الشهيرة التي ارتبط اسمها بمجزرة بشعة عام 1948؟", category: "تاريخ فلسطين ⏳", type: "حركة", value: "🎲 صح: تقدم 4 خطوات | خطأ: ارجع خطوتين", color: "#3498db", answer: "دير ياسين" },
      { text: "كم عدد أركان الإسلام؟", category: "ثقافة إسلامية 📜", type: "حركة", value: "🎲 صح: تقدم 3 خطوات | خطأ: ارجع خطوتين", color: "#3498db", answer: "5 أركان" },
      { text: "ما هي المدينة الفلسطينية التي تعتبر مركزاً لمحافظة طوباس؟", category: "جغرافيا فلسطين 📍", type: "حركة", value: "🎲 صح: تقدم 3 خطوات | خطأ: ارجع خطوة", color: "#3498db", answer: "طوباس" },
      { text: "ما هي كنية زوجة الرسول ﷺ أم المؤمنين عائشة؟", category: "تاريخ إسلامي 🕋", type: "حركة", value: "🎲 صح: تقدم 4 خطوات | خطأ: ارجع خطوتين", color: "#3498db", answer: "أم عبد الله" },
      { text: "ما هو المعلم السوري التاريخي الفخم الذي بني في عهد الدولة الأموية بدمشق؟", category: "تاريخ وثقافة 🏛️", type: "حركة", value: "🎲 صح: تقدم 4 خطوات | خطأ: ارجع خطوتين", color: "#3498db", answer: "الجامع الأموي الكبير" },
      { text: "ما هي السورة القرآنية التي تنتهي جميع آياتها بحرف الراء؟", category: "ثقافة إسلامية 📜", type: "حركة", value: "🎲 صح: تقدم 5 خطوات | خطأ: ارجع خطوتين", color: "#3498db", answer: "سورة الكوثر" },
      { text: "ما هي المدينة الفلسطينية الواقعة في النقب وتعتبر عاصمتها؟", category: "جغرافيا فلسطين 📍", type: "حركة", value: "🎲 صح: تقدم 4 خطوات | خطأ: ارجع خطوتين", color: "#3498db", answer: "بئر السبع" },
      { text: "من هو الملك الصالح الذي بنى سد ذي القرنين؟", category: "قصص القرآن 📜", type: "حركة", value: "🎲 صح: تقدم 4 خطوات | خطأ: ارجع خطوتين", color: "#3498db", answer: "الملك ذو القرنين" },
      { text: "ما هي السورة التي تسمى 'الفاضحة' لأنها كشفت المنافقين؟", category: "ثقافة إسلامية 📜", type: "حركة", value: "🎲 صح: تقدم 4 خطوات | خطأ: ارجع خطوتين", color: "#3498db", answer: "سورة التوبة" },
      { text: "ما هي أقدم كنيسة مأهولة وموجودة في مدينة بيت لحم بفلسطين؟", category: "تاريخ فلسطين ⏳", type: "حركة", value: "🎲 صح: تقدم 4 خطوات | خطأ: ارجع خطوتين", color: "#3498db", answer: "كنيسة المهد" },
      { text: "من هو النبي الذي كلم الله تعالى مباشرة دون وحي مادي؟", category: "قصص الأنبياء 🕋", type: "حركة", value: "🎲 صح: تقدم 3 خطوات | خطأ: ارجع خطوة", color: "#3498db", answer: "موسى عليه السلام" },
      { text: "ما هي أكبر بحيرة عذبة بالكامل في فلسطين التاريخية؟", category: "جغرافيا فلسطين 📍", type: "حركة", value: "🎲 صح: تقدم 4 خطوات | خطأ: ارجع خطوتين", color: "#3498db", answer: "بحيرة طبريا" },
      { text: "كم عدد المرات التي ذكر فيها اسم 'رمضان' صراحة في القرآن؟", category: "ثقافة إسلامية 📜", type: "حركة", value: "🎲 صح: تقدم 5 خطوات | خطأ: ارجع خطوتين", color: "#3498db", answer: "مرة واحدة" }
    ];

    // تكرار الأسئلة ومضاعفتها برمجياً لملء مصفوفة الـ 100 سؤال حركة بالكامل ومنع أي انقطاع باللعب
    while(stepsQuestions.length < 100) {
      stepsQuestions.push(...stepsQuestions.map(q => ({...q, text: q.text + " (جولة مكررة متطورة)"})));
    }
    stepsQuestions.length = 100;

    // 2. مصفوفة كروت جاوب واربح (100 سؤال مالي عميق ومحكم بالكامل وتعديل لغز نبي الله زكريا)
    const moneyQuestions = [
      { text: "من هو نبي الله الذي صام عن كلام الناس ثلاث ليالٍ سوياً كآية من الله تعالى؟", category: "قصص الأنبياء 🕋", type: "مالي", value: "💰 صح: اربح 50 شيكل | خطأ: ادفع 30 شيكل", color: "#27ae60", answer: "نبي الله زكريا عليه السلام (وكذلك السيدة مريم عليها السلام نذرت صوماً عن الكلام)" },

      document.getElementById('aBox').style.display = 'none';
      document.getElementById('btnShowAnswer').style.display = 'block';

      const q = bank[Math.floor(Math.random() * bank.length)];
      
      document.getElementById('qCategory').innerText = q.category;
      document.getElementById('qType').innerText = q.type;
      document.getElementById('qText').innerText = q.text;
      document.getElementById('aText').innerText = q.answer;

      rb.innerText = q.value;
      rb.style.cssText = `background: ${q.color}15; border-color: ${q.color}; color: ${q.color};`;
