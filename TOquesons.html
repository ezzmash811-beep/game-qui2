<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>بنك أسئلة مونوبولي المطور</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      --primary: #145a32;
      --secondary: #2ecc71;
      --gold: #f39c12;
      --bg: #f4f6f7;
      --card-bg: #ffffff;
      --text: #2c3e50;
    }

    body {
      margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg); color: var(--text);
      display: flex; justify-content: center; align-items: center; min-height: 100vh;
    }

    .container { width: 90%; max-width: 500px; text-align: center; }
    .title { color: var(--primary); margin-bottom: 30px; font-size: 2rem; }

    .card {
      background: var(--card-bg); border-radius: 20px; padding: 30px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.1); position: relative;
      border-top: 8px solid var(--primary); min-height: 250px;
      display: flex; flex-direction: column; justify-content: center;
    }

    .badges { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
    .badge { padding: 6px 15px; border-radius: 20px; font-size: 0.9rem; font-weight: bold; color: white; }
    .badge-category { background: #3498db; }
    .diff-easy { background: #2ecc71; }
    .diff-medium { background: #f39c12; }
    .diff-hard { background: #e74c3c; }

    .question-text {
      font-size: 1.5rem; line-height: 1.6; margin-bottom: 25px;
      font-weight: bold; color: #34495e; min-height: 80px;
    }

    .reward-box {
      font-size: 1.2rem; font-weight: bold; padding: 12px; border-radius: 10px;
      margin-bottom: 20px; border: 2px dashed; transition: all 0.3s;
    }

    .answer-box {
      display: none; background: #ecf0f1; padding: 15px; border-radius: 10px;
      font-size: 1.2rem; color: #16a085; font-weight: bold;
      margin-bottom: 20px; border-right: 5px solid #16a085; text-align: right;
    }

    .buttons-container { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }

    .btn {
      color: white; border: none; padding: 15px; font-size: 1.1rem; 
      border-radius: 10px; cursor: pointer; font-weight: bold; 
      transition: all 0.2s; width: 100%;
    }

    .btn:hover { transform: translateY(-2px); }
    .btn:disabled { background: #bdc3c7 !important; cursor: not-allowed; }
    
    .btn-primary { background: var(--primary); }
    .btn-gold { background: var(--gold); }
    .btn-secondary { background: #7f8c8d; }
    
    #initialState { font-size: 1.3rem; color: #7f8c8d; margin-bottom: 20px; }
  </style>
</head>
<body>

  <div class="container">
    <h1 class="title">🎲 بنك الأسئلة والجوائز</h1>
    
    <div class="card">
      <div id="initialState">اختر نوع السحب الذي تريده من الأزرار بالأسفل..</div>

      <div id="questionContent" style="display: none;">
        <div class="badges">
          <span class="badge badge-category" id="qCategory">عامة</span>
          <span class="badge" id="qDifficulty">متوسط</span>
        </div>
        
        <div class="question-text" id="qText">هنا يظهر نص السؤال؟</div>
        <div class="reward-box" id="qReward">🎁 الجائزة تظهر هنا</div>

        <div class="answer-box" id="aBox">
          الإجابة: <span id="aText">هنا تظهر الإجابة</span>
        </div>
      </div>
      
      <button class="btn btn-secondary" id="btnShowAnswer" onclick="showAnswer()" style="display: none; margin-bottom: 15px;">👀 إظهار الإجابة الصحيحة</button>
      
      <div class="buttons-container">
        <button class="btn btn-primary" id="btnDrawSteps" onclick="drawNewQuestion('steps')">🎯 سحب سؤال للتقدم (خطوات)</button>
        <button class="btn btn-gold" id="btnDrawMoney" onclick="drawNewQuestion('money')">💰 جاوب واربح (مبالغ مالية)</button>
      </div>
    </div>
  </div>

  <script>
    // بنك أسئلة الخطوات (تركيز على المعلومات العامة والدينية)
    const stepsQuestions = [
      { text: "ما هي القبلة الأولى للمسلمين؟", answer: "المسجد الأقصى", category: "دينية", difficulty: "سهل", diffClass: "diff-easy", value: 3 },
      { text: "من هو النبي الذي لُقب بـ (أبو الأنبياء)؟", answer: "إبراهيم عليه السلام", category: "دينية", difficulty: "سهل", diffClass: "diff-easy", value: 4 },
      { text: "ما هو أعمق محيط في العالم؟", answer: "المحيط الهادئ", category: "جغرافيا", difficulty: "متوسط", diffClass: "diff-medium", value: 6 },
      { text: "في أي مدينة ولد النبي محمد ﷺ؟", answer: "مكة المكرمة", category: "دينية", difficulty: "سهل", diffClass: "diff-easy", value: 2 },
      { text: "كم عدد القراءات الصحيحة للقرآن الكريم؟", answer: "عشر قراءات", category: "دينية", difficulty: "صعب", diffClass: "diff-hard", value: 10 },
      { text: "ما هو الحيوان الذي يُسمى 'سفينة الصحراء'؟", answer: "الجمل", category: "علوم", difficulty: "سهل", diffClass: "diff-easy", value: 3 },
      { text: "من هو القائد المسلم الذي فتح الأندلس؟", answer: "طارق بن زياد", category: "تاريخ", difficulty: "متوسط", diffClass: "diff-medium", value: 7 },
      { text: "ما هو الكوكب الذي يمتلك حلقات حوله؟", answer: "زحل", category: "فضاء", difficulty: "سهل", diffClass: "diff-easy", value: 4 },
      { text: "ما اسم ناقة النبي محمد ﷺ؟", answer: "القصواء", category: "دينية", difficulty: "صعب", diffClass: "diff-hard", value: 12 },
      { text: "أين يوجد أطول سور في العالم؟", answer: "في الصين", category: "عجائب", difficulty: "متوسط", diffClass: "diff-medium", value: 5 }
    ];

    // بنك أسئلة الأرباح (تركيز على الألغاز والذكاء)
    const moneyQuestions = [
      { text: "ما هو الشيء الذي يكسو الناس وهو عارٍ؟", answer: "الإبرة", category: "لغز", difficulty: "سهل", diffClass: "diff-easy", value: 150 },
      { text: "شيء له أسنان ولا يعض، ما هو؟", answer: "المشط", category: "لغز", difficulty: "سهل", diffClass: "diff-easy", value: 100 },
      { text: "ما هو الشيء الذي يحوي مدناً بلا بيوت وجبالاً بلا شجر؟", answer: "الخريطة", category: "ذكاء", difficulty: "متوسط", diffClass: "diff-medium", value: 350 },
      { text: "كلمة من 5 أحرف، إذا حذفت حرفين يبقى حرف، ما هي؟", answer: "كلمة (حرفان)", category: "لغز", difficulty: "صعب", diffClass: "diff-hard", value: 600 },
      { text: "ما هو الشيء الذي تذبحه وتبكي عليه؟", answer: "البصل", category: "لغز", difficulty: "سهل", diffClass: "diff-easy", value: 100 },
      { text: "ما هو البيت الذي ليس فيه أبواب ولا نوافذ؟", answer: "بيت الشعر", category: "ذكاء", difficulty: "متوسط", diffClass: "diff-medium", value: 400 },
      { text: "شيء تملكه أنت، ولكن يستخدمه الناس أكثر منك؟", answer: "اسمك", category: "لغز", difficulty: "متوسط", diffClass: "diff-medium", value: 300 },
      { text: "ما هو أضعف البيوت على وجه الأرض؟", answer: "بيت العنكبوت", category: "دينية", difficulty: "سهل", diffClass: "diff-easy", value: 200 },
      { text: "شيء يمشي بلا أرجل ويدخل الأذن فقط؟", answer: "الصوت", category: "ذكاء", difficulty: "صعب", diffClass: "diff-hard", value: 550 },
      { text: "ما هو الشيء الذي يتكلم بكل لغات العالم؟", answer: "صدى الصوت", category: "لغز", difficulty: "متوسط", diffClass: "diff-medium", value: 450 }
    ];

    function drawNewQuestion(drawType) {
      document.getElementById('initialState').style.display = 'none';
      document.getElementById('questionContent').style.display = 'block';
      document.getElementById('aBox').style.display = 'none';
      document.getElementById('btnShowAnswer').style.display = 'block';

      // اختيار البنك المناسب
      const bank = (drawType === 'money') ? moneyQuestions : stepsQuestions;
      const q = bank[Math.floor(Math.random() * bank.length)];

      // العرض
      document.getElementById('qCategory').innerText = q.category;
      const diffBadge = document.getElementById('qDifficulty');
      diffBadge.innerText = q.difficulty;
      diffBadge.className = 'badge ' + q.diffClass;
      document.getElementById('qText').innerText = q.text;
      
      const rewardBox = document.getElementById('qReward');
      if (drawType === 'money') {
        rewardBox.innerText = `💰 جائزة الإجابة: ${q.value} عملة`;
        rewardBox.style.backgroundColor = '#fef9e7'; rewardBox.style.borderColor = '#f1c40f'; rewardBox.style.color = '#b7950b';
      } else {
        rewardBox.innerText = `🎯 تقدم ${q.value} خطوات!`;
        rewardBox.style.backgroundColor = '#e8f5e9'; rewardBox.style.borderColor = '#2ecc71'; rewardBox.style.color = '#145a32';
      }
      document.getElementById('aText').innerText = q.answer;
    }

    function showAnswer() {
      document.getElementById('aBox').style.display = 'block';
      document.getElementById('btnShowAnswer').style.display = 'none';
    }
  </script>
</body>
</html>
