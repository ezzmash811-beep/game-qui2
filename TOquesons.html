<!DOCTYPE html>
<html lang="ar" dir="rtl">

  <meta charset="utf-8">

  <style>
    :root { --primary: #145a32; --secondary: #2ecc71; --gold: #f39c12; --bg: #f4f6f7; --card-bg: #ffffff; --text: #2c3e50; }
    body { margin: 0; font-family: 'Segoe UI', Tahoma, sans-serif; background-color: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .container { width: 95%; max-width: 500px; text-align: center; }
    .card { background: var(--card-bg); border-radius: 20px; padding: 25px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); border-top: 8px solid var(--primary); min-height: 350px; display: flex; flex-direction: column; justify-content: center; }
    .badges { display: flex; justify-content: center; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
    .badge { padding: 5px 12px; border-radius: 15px; font-size: 0.85rem; font-weight: bold; color: white; }
    .badge-category { background: #3498db; }
    .diff-easy { background: #2ecc71; }
    .diff-medium { background: #f39c12; }
    .diff-hard { background: #e74c3c; }
    .question-text { font-size: 1.3rem; line-height: 1.5; margin-bottom: 20px; font-weight: bold; color: #34495e; }
    .reward-box { font-size: 1.1rem; font-weight: bold; padding: 10px; border-radius: 10px; margin-bottom: 15px; border: 2px dashed; }
    .answer-box { display: none; background: #ecf0f1; padding: 15px; border-radius: 10px; font-size: 1.1rem; color: #16a085; font-weight: bold; margin-bottom: 15px; border-right: 5px solid #16a085; }
    .buttons-container { display: flex; flex-direction: column; gap: 10px; }
    .btn { color: white; border: none; padding: 14px; font-size: 1rem; border-radius: 10px; cursor: pointer; font-weight: bold; transition: 0.2s; }
    .btn-primary { background: var(--primary); }
    .btn-gold { background: var(--gold); }
    .btn-secondary { background: #7f8c8d; }
  </style>
</head>

      { text: "بنك لا يتعامل بالمال أبداً؟", answer: "بنك الدم", category: "لغز", difficulty: "سهل", diffClass: "diff-easy", value: 100 },
      { text: "أوله في لبنان وآخره في إسطنبول؟", answer: "حرف اللام", category: "ذكاء", difficulty: "صعب", diffClass: "diff-hard", value: 500 },
      { text: "يرفع أثقالاً وسفناً ولا يستطيع رفع مسمار؟", answer: "البحر", category: "لغز", difficulty: "متوسط", diffClass: "diff-medium", value: 300 },
      { text: "ما هو القبر الذي سار بصاحبه؟", answer: "حوت يونس عليه السلام", category: "دين", difficulty: "متوسط", diffClass: "diff-medium", value: 400 },
      { text: "5 أشخاص تحت مظلة واحدة ولا يبتل أحد منهم، كيف؟", answer: "لأنها لم تكن تمطر", category: "ذكاء", difficulty: "سهل", diffClass: "diff-easy", value: 200 },
      { text: "ما هو الشيء الذي ترميه كلما احتجت إليه؟", answer: "شبكة الصيد", category: "لغز", difficulty: "متوسط", diffClass: "diff-medium", value: 350 },
      { text: "يكتب ولا يقرأ أبداً؟", answer: "القلم", category: "لغز", difficulty: "سهل", diffClass: "diff-easy", value: 100 }
    ];

    function drawNewQuestion(type) {
      document.getElementById('initialState').style.display = 'none';
      document.getElementById('questionContent').style.display = 'block';
      document.getElementById('aBox').style.display = 'none';
      document.getElementById('btnShowAnswer').style.display = 'block';
      const bank = (type === 'steps') ? stepsQuestions : moneyQuestions;
      const q = bank[Math.floor(Math.random() * bank.length)];
      document.getElementById('qCategory').innerText = q.category;
      document.getElementById('qDifficulty').innerText = q.difficulty;
      document.getElementById('qDifficulty').className = 'badge ' + q.diffClass;
      document.getElementById('qText').innerText = q.text;
      document.getElementById('aText').innerText = q.answer;
      const rb = document.getElementById('qReward');
      if(type === 'steps') {
        rb.innerText = `🎯 تقدم ${q.value} خطوات`;
        rb.style.cssText = "background:#e8f5e9; border-color:#2ecc71; color:#145a32;";
      } else {
        rb.innerText = `💰 اربح ${q.value} عملة`;
        rb.style.cssText = "background:#fef9e7; border-color:#f1c40f; color:#b7950b;";
      }
    }

    function showAnswer() {
      document.getElementById('aBox').style.display = 'block';
      document.getElementById('btnShowAnswer').style.display = 'none';
    }
  </script>
</body>
</html>
